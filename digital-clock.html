<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .header p {
            font-size: 1.1em;
            color: #10b981;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .controls input,
        .controls button,
        .controls select {
            padding: 12px 20px;
            border: 2px solid #10b981;
            border-radius: 25px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .controls input::placeholder {
            color: rgba(16, 185, 129, 0.5);
        }

        .controls input,
        .controls select {
            border-right: 25px solid transparent;
        }

        .controls button {
            font-weight: bold;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
        }

        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(10, 122, 92, 0.1));
            border: 2px solid #10b981;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .clock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.4);
            border-color: #059669;
        }

        .clock-card:hover::before {
            left: 100%;
        }

        .timezone-name {
            font-size: 1.3em;
            color: #10b981;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .digital-time {
            font-size: 3.5em;
            color: #10b981;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
            line-height: 1.1;
        }

        .time-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #7dd3c0;
        }

        .detail-item {
            background: rgba(16, 185, 129, 0.1);
            padding: 8px;
            border-radius: 8px;
            border-left: 3px solid #10b981;
        }

        .detail-label {
            font-size: 0.8em;
            color: #5eead4;
            text-transform: uppercase;
        }

        .detail-value {
            font-weight: bold;
            color: #10b981;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            border: 3px solid #10b981;
            border-radius: 50%;
            margin: 15px auto;
            position: relative;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1), rgba(10, 122, 92, 0.1));
            box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .clock-center {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #10b981;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 35px;
            background: #10b981;
            margin-left: -3px;
        }

        .minute-hand {
            width: 4px;
            height: 45px;
            background: #7dd3c0;
            margin-left: -2px;
        }

        .second-hand {
            width: 2px;
            height: 50px;
            background: #ef4444;
            margin-left: -1px;
        }

        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            color: #10b981;
            font-size: 0.9em;
            font-weight: bold;
        }

        .clock-number span {
            display: inline-block;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .no-clocks {
            text-align: center;
            color: #7dd3c0;
            font-size: 1.2em;
            padding: 40px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px dashed #10b981;
            border-radius: 15px;
        }

        .footer {
            text-align: center;
            color: #5eead4;
            margin-top: 40px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .digital-time {
                font-size: 2.5em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .controls input,
            .controls button,
            .controls select {
                width: 100%;
            }
        }

        .time-format-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .format-btn {
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            color: #10b981;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .format-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⏰ Digital Clock</h1>
        <p>Global Time Zone Viewer</p>
    </div>

    <div class="controls">
        <input type="text" id="timezoneInput" placeholder="Enter timezone (e.g., America/New_York)">
        <button onclick="addTimezone()">Add Timezone ➕</button>
        <select id="presetTimezones" onchange="addPresetTimezone()">
            <option value="">Quick Add Timezones...</option>
            <option value="America/New_York">New York (EST)</option>
            <option value="Europe/London">London (GMT)</option>
            <option value="Asia/Tokyo">Tokyo (JST)</option>
            <option value="Australia/Sydney">Sydney (AEDT)</option>
            <option value="Asia/Dubai">Dubai (GST)</option>
            <option value="Asia/Bangkok">Bangkok (ICT)</option>
            <option value="Europe/Paris">Paris (CET)</option>
            <option value="America/Los_Angeles">Los Angeles (PST)</option>
            <option value="Asia/Singapore">Singapore (SGT)</option>
            <option value="India/Kolkata">India (IST)</option>
            <option value="America/Toronto">Toronto (EST)</option>
            <option value="America/Mexico_City">Mexico City (CST)</option>
        </select>
    </div>

    <div class="time-format-toggle">
        <button class="format-btn active" onclick="setTimeFormat(24)">24-Hour</button>
        <button class="format-btn" onclick="setTimeFormat(12)">12-Hour</button>
    </div>

    <div class="clocks-grid" id="clocksGrid">
        <div class="no-clocks">Select a timezone to get started! 🌍</div>
    </div>

    <div class="footer">
        <p>💡 Tip: Add multiple timezones to compare times around the world!</p>
    </div>
</div>

<script>
    let timezones = [];
    let timeFormat = 24; // 24-hour format by default
    let animationIds = {};

    // Add sample timezones on page load
    window.addEventListener('load', () => {
        addTimezone('UTC');
        addTimezone('America/New_York');
        addTimezone('Asia/Tokyo');
    });

    function addTimezone(tz = null) {
        const timezone = tz || document.getElementById('timezoneInput').value.trim();
        
        if (!timezone) {
            alert('Please enter a timezone!');
            return;
        }

        if (timezones.includes(timezone)) {
            alert('This timezone is already added!');
            return;
        }

        // Validate timezone
        try {
            new Date().toLocaleString('en-US', { timeZone: timezone });
            timezones.push(timezone);
            document.getElementById('timezoneInput').value = '';
            document.getElementById('presetTimezones').value = '';
            renderClocks();
        } catch (err) {
            alert(`Invalid timezone: ${timezone}`);
        }
    }

    function addPresetTimezone() {
        const timezone = document.getElementById('presetTimezones').value;
        if (timezone) {
            addTimezone(timezone);
        }
    }

    function removeTimezone(index) {
        if (animationIds[index]) {
            cancelAnimationFrame(animationIds[index]);
        }
        timezones.splice(index, 1);
        renderClocks();
    }

    function setTimeFormat(format) {
        timeFormat = format;
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
        renderClocks();
    }

    function renderClocks() {
        const grid = document.getElementById('clocksGrid');
        
        if (timezones.length === 0) {
            grid.innerHTML = '<div class="no-clocks">Select a timezone to get started! 🌍</div>';
            return;
        }

        grid.innerHTML = timezones.map((tz, index) => `
            <div class="clock-card">
                <button class="remove-btn" onclick="removeTimezone(${index})">✕</button>
                <div class="timezone-name">${formatTimezoneName(tz)}</div>
                
                <div class="analog-clock" id="analog-${index}">
                    <div class="clock-number" id="numbers-${index}"></div>
                    <div class="hand hour-hand" id="hour-${index}"></div>
                    <div class="hand minute-hand" id="minute-${index}"></div>
                    <div class="hand second-hand" id="second-${index}"></div>
                    <div class="clock-center"></div>
                </div>
                
                <div class="digital-time" id="digital-${index}"></div>
                
                <div class="time-details">
                    <div class="detail-item">
                        <div class="detail-label">Date</div>
                        <div class="detail-value" id="date-${index}"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Day</div>
                        <div class="detail-value" id="day-${index}"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">UTC Offset</div>
                        <div class="detail-value" id="offset-${index}"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Week</div>
                        <div class="detail-value" id="week-${index}"></div>
                    </div>
                </div>
            </div>
        `).join('');

        // Initialize clock numbers
        timezones.forEach((tz, index) => {
            drawClockNumbers(index);
        });

        // Start animation loop
        updateAllClocks();
    }

    function drawClockNumbers(index) {
        const numbersContainer = document.getElementById(`numbers-${index}`);
        if (!numbersContainer) return;

        numbersContainer.innerHTML = '';
        for (let i = 1; i <= 12; i++) {
            const span = document.createElement('span');
            span.textContent = i;
            span.style.transform = `rotate(${i * 30}deg) translateY(-60px)`;
            numbersContainer.appendChild(span);
        }
    }

    function updateAllClocks() {
        timezones.forEach((tz, index) => {
            updateClock(tz, index);
        });
        animationIds[0] = requestAnimationFrame(updateAllClocks);
    }

    function updateClock(timezone, index) {
        const now = new Date();
        const tzTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));

        // Digital time
        const hours = tzTime.getHours();
        const minutes = tzTime.getMinutes();
        const seconds = tzTime.getSeconds();

        let displayHours = hours;
        let period = '';

        if (timeFormat === 12) {
            period = hours >= 12 ? ' PM' : ' AM';
            displayHours = hours % 12 || 12;
        }

        const digitalTime = `${pad(displayHours)}:${pad(minutes)}:${pad(seconds)}${period}`;
        const digitalElement = document.getElementById(`digital-${index}`);
        if (digitalElement) {
            digitalElement.textContent = digitalTime;
        }

        // Analog clock hands
        const secondDegrees = (seconds / 60) * 360;
        const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
        const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

        const hourHand = document.getElementById(`hour-${index}`);
        const minuteHand = document.getElementById(`minute-${index}`);
        const secondHand = document.getElementById(`second-${index}`);

        if (hourHand) hourHand.style.transform = `rotate(${hourDegrees}deg)`;
        if (minuteHand) minuteHand.style.transform = `rotate(${minuteDegrees}deg)`;
        if (secondHand) secondHand.style.transform = `rotate(${secondDegrees}deg)`;

        // Date and details
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const dateElement = document.getElementById(`date-${index}`);
        if (dateElement) {
            dateElement.textContent = `${tzTime.getDate()} ${months[tzTime.getMonth()]}`;
        }

        const dayElement = document.getElementById(`day-${index}`);
        if (dayElement) {
            dayElement.textContent = days[tzTime.getDay()];
        }

        // UTC Offset
        const offsetElement = document.getElementById(`offset-${index}`);
        if (offsetElement) {
            const offset = getUTCOffset(timezone);
            offsetElement.textContent = offset;
        }

        // Week number
        const weekElement = document.getElementById(`week-${index}`);
        if (weekElement) {
            const weekNum = getWeekNumber(tzTime);
            weekElement.textContent = `W${weekNum}`;
        }
    }

    function pad(num) {
        return String(num).padStart(2, '0');
    }

    function formatTimezoneName(tz) {
        return tz.replace(/_/g, ' ').split('/').pop();
    }

    function getUTCOffset(timezone) {
        const now = new Date();
        const utcTime = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
        const tzTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
        
        const diffMs = tzTime - utcTime;
        const diffMins = Math.round(diffMs / 60000);
        const hours = Math.floor(diffMins / 60);
        const mins = Math.abs(diffMins % 60);

        const sign = diffMins >= 0 ? '+' : '-';
        return `UTC ${sign}${pad(Math.abs(hours))}:${pad(mins)}`;
    }

    function getWeekNumber(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }
</script>

</body>
</html>
